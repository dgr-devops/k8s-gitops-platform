apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://github.com/dgr-devops/k8s-gitops-app.git
      # Prod fija una etiqueta del repo de la app; dev sigue main.
      targetRevision: v1.0.0
      path: chart
      helm:
        releaseName: demo-app-prod
        valueFiles:
          - $values/envs/prod/app-values.yaml
    - repoURL: https://github.com/dgr-devops/k8s-gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
